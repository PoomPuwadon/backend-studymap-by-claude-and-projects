<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backend track</title>
<meta name="description" content="Public progress tracker: zero to contributing on a production Go service.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
--paper:#E9ECF0;--surface:#fff;--ink:#16202C;--muted:#5C6A7A;--faint:#8D99A6;
--rule:#C9D1DA;--amber:#C77A1E;--amberbg:#F7E9D3;--teal:#2E7D74;--tealbg:#D9E9E6;--red:#A83A2C;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55}
a{color:var(--teal)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

.bar{border-bottom:1px solid var(--rule);background:var(--surface);position:sticky;top:0;z-index:20}
.bar-in{max-width:900px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:12px}
.brand{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600}
.spacer{flex:1}
.mode{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint)}
.btn{font:inherit;font-size:13px;background:none;border:1px solid var(--rule);color:var(--muted);
padding:5px 12px;cursor:pointer;border-radius:0}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{opacity:.85;color:#fff}

.wrap{max-width:900px;margin:0 auto;padding:34px 24px 90px}
h1{font-family:'IBM Plex Mono',monospace;font-size:25px;font-weight:600;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 26px;max-width:62ch}

.gauge{background:var(--surface);border:1px solid var(--rule);padding:22px;margin-bottom:12px}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:15px}
.gauge-l{font-size:14px;color:var(--muted);max-width:44ch}
.gauge-n{font-family:'IBM Plex Mono',monospace;font-size:38px;font-weight:600;line-height:1;letter-spacing:-.03em}
.gauge-n span{font-size:18px;color:var(--faint)}
.track{height:9px;background:#DCE2E8}
.fill{height:100%;background:var(--amber);width:0;transition:width .7s cubic-bezier(.22,.61,.36,1)}
.stats{display:flex;gap:22px;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);flex-wrap:wrap}

.target{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--ink);padding:16px 20px;margin-bottom:30px}
.target h2{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;margin:0 0 6px}
.target p{margin:0 0 9px;font-size:14px;color:var(--muted)}
.specs{display:flex;flex-wrap:wrap;gap:5px}
.spec{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 7px;background:var(--paper);border:1px solid var(--rule);color:var(--muted)}

.tier{border-top:1px solid var(--rule)}
.tier:last-of-type{border-bottom:1px solid var(--rule)}
.thead{width:100%;text-align:left;background:none;border:0;font:inherit;color:inherit;cursor:pointer;
padding:16px 4px;display:flex;gap:14px;align-items:baseline}
.thead:hover{background:rgba(0,0,0,.015)}
.thead:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.tnum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--faint);width:20px;flex-shrink:0}
.tmain{flex:1;min-width:0}
.tname{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500}
.tgoal{font-size:13px;color:var(--muted);margin-top:2px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 7px;border:1px solid var(--rule);background:var(--paper);flex-shrink:0}
.pill.done{background:var(--tealbg);border-color:var(--teal);color:var(--teal)}
.pill.now{background:var(--amberbg);border-color:var(--amber);color:var(--amber)}

.tbody{display:none;padding:0 4px 20px 34px}
.tier.open .tbody{display:block}
.mod{border-left:1px solid var(--rule);padding-left:16px;margin-bottom:16px}
.mname{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}

.task{display:flex;gap:9px;align-items:flex-start;padding:5px 0;flex-wrap:wrap}
.mark{width:13px;height:13px;margin-top:4px;flex-shrink:0;border:1px solid var(--faint);background:var(--surface)}
.mark.on{background:var(--teal);border-color:var(--teal)}
.task input[type=checkbox]{margin:4px 0 0;width:14px;height:14px;flex-shrink:0;accent-color:var(--teal);cursor:pointer}
.tlabel{font-size:14px}
.task.on .tlabel{color:var(--faint);text-decoration:line-through}
.tickdate{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);margin-top:4px;display:inline-flex;align-items:center;gap:4px}
.editdate{background:none;border:0;padding:1px 2px;color:var(--faint);cursor:pointer;font-size:12px;line-height:1}
.editdate:hover{color:var(--ink)}
.dateedit{font:inherit;font-size:11px;padding:1px 4px;border:1px solid var(--rule);background:var(--paper);border-radius:0;font-family:'IBM Plex Mono',monospace}
.dl{margin-top:9px;font-size:14px}
.flag{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:1px 5px;background:var(--amberbg);color:var(--amber);border:1px solid var(--amber);margin-left:6px;white-space:nowrap}

.art{margin:5px 0 10px 23px;border:1px solid var(--rule);background:var(--surface);padding:9px 12px}
.art a{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-right:14px;word-break:break-all}
.art .note{font-size:13px;color:var(--muted);margin-top:3px}
.art.empty{border-style:dashed;color:var(--faint);font-size:13px}
.art input{display:block;width:100%;font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--rule);margin-bottom:5px;background:var(--paper);border-radius:0}

.proof{margin-top:12px;padding:10px 13px;background:var(--paper);border:1px solid var(--rule);font-size:13px}
.proof strong{font-family:'IBM Plex Mono',monospace;font-size:11px;display:block;margin-bottom:2px}

.foot{margin-top:26px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);
display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.dialog{position:fixed;inset:0;background:rgba(22,32,44,.45);display:flex;align-items:center;
justify-content:center;padding:20px;z-index:50}
.card{background:var(--surface);border:1px solid var(--rule);max-width:440px;width:100%;padding:22px}
.card h3{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;margin:0 0 8px}
.card p{font-size:13px;color:var(--muted);margin:0 0 12px}
.card input{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--rule);
background:var(--paper);margin-bottom:9px;border-radius:0}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.err{color:var(--red);font-size:13px;margin:0 0 9px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;
font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 15px;z-index:60}
.dirty{color:var(--amber)}
.boot{padding:70px 24px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:620px){.wrap{padding:22px 15px 70px}.bar-in{padding:11px 15px}.tbody{padding-left:12px}.gauge-n{font-size:31px}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div id="app"><div class="boot">Loading…</div></div>

<script>
"use strict";

/* ---- edit these two lines after you create the repo ---- */
const REPO_OWNER = "PoomPuwadon";
const REPO_NAME  = "backend-studymap-by-claude-and-projects";
const BRANCH     = "main";
/* -------------------------------------------------------- */

const API = "https://api.github.com";
const TOKEN_KEY = "bt_token";

let CUR = null;                 // curriculum
let ST  = { done:{}, projects:{} };
let SHA = null;                 // sha of progress.json
let SVG_SHA = null;              // sha of progress-bar.svg
let token = null;
let dirty = false;
let openTiers = new Set();
let dialog = false, dialogErr = "";
let editingDate = null;    // id of task whose tick-date is being edited

/* date helpers */
function todayISO(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function ordinal(n){
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function fmtDate(iso){
  if (typeof iso !== "string") return "";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return "";
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return ordinal(d.getDate()) + " " + months[d.getMonth()] + " " + d.getFullYear();
}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[<>&"]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : null;

/* counts */
const tierTasks = t => t.modules.reduce((a,m) => a + m.tasks.length, 0);
const tierDone  = t => t.modules.reduce((a,m) => a + m.tasks.filter(k => ST.done[k.id]).length, 0);
const allTasks  = () => CUR.tiers.reduce((a,t) => a + tierTasks(t), 0);
const allDone   = () => CUR.tiers.reduce((a,t) => a + tierDone(t), 0);
const current   = () => {
  for (let i = 0; i < CUR.tiers.length; i++) if (tierDone(CUR.tiers[i]) < tierTasks(CUR.tiers[i])) return i;
  return CUR.tiers.length - 1;
};

/* base64 that survives non-ASCII */
function b64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function unb64(s){
  const bin = atob(s.replace(/\s/g, ""));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function toast(msg, ms){
  const old = $(".toast"); if (old) old.remove();
  const d = document.createElement("div");
  d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), ms || 2200);
}

/* ---------- load ---------- */
async function boot(){
  try {
    const bust = "?v=" + Date.now();
    const [c, p] = await Promise.all([
      fetch("curriculum.json" + bust).then(r => { if(!r.ok) throw new Error("curriculum.json missing"); return r.json(); }),
      fetch("progress.json" + bust).then(r => r.ok ? r.json() : { done:{}, projects:{} }).catch(() => ({ done:{}, projects:{} }))
    ]);
    CUR = c;
    ST = { done: p.done || {}, projects: p.projects || {} };
  } catch (e) {
    $("#app").innerHTML = '<div class="boot">Could not load curriculum.json.<br>' + esc(e.message) + "</div>";
    return;
  }
  token = localStorage.getItem(TOKEN_KEY);
  openTiers.add(current());
  render();
  if (token) fetchShas();
}

async function fetchFileSha(path){
  const r = await fetch(`${API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`,
    { headers:{ Authorization:"Bearer " + token, Accept:"application/vnd.github+json" } });
  if (r.ok) { const j = await r.json(); return j.sha; }
  if (r.status === 401) { signOut(); toast("Token rejected — signed out"); }
  return null; // 404 (file doesn't exist yet) or offline: creation/retry handles it
}

async function fetchShas(){
  try {
    SHA = await fetchFileSha("progress.json");
    SVG_SHA = await fetchFileSha("progress-bar.svg");
  } catch(e){ /* offline: save will retry */ }
}

/* ---------- progress bar svg ---------- */
function buildBarSvg(){
  const d = allDone(), n = allTasks(), pct = n ? Math.round(d / n * 100) : 0;
  const w = 760, h = 60, pad = 20, trackY = 38, trackH = 10;
  const barW = Math.round((w - pad * 2) * pct / 100);
  const font = "IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace";
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Progress ' + pct + '%">' +
    '<rect width="' + w + '" height="' + h + '" fill="#E9ECF0"/>' +
    '<text x="' + pad + '" y="24" font-family="' + font + '" font-size="14" font-weight="600" fill="#16202C">backend track — ' + pct + '%</text>' +
    '<text x="' + (w - pad) + '" y="24" font-family="' + font + '" font-size="12" fill="#5C6A7A" text-anchor="end">' + d + '/' + n + ' tasks</text>' +
    '<rect x="' + pad + '" y="' + trackY + '" width="' + (w - pad * 2) + '" height="' + trackH + '" fill="#DCE2E8"/>' +
    '<rect x="' + pad + '" y="' + trackY + '" width="' + barW + '" height="' + trackH + '" fill="#C77A1E"/>' +
    "</svg>";
}

/* ---------- save ---------- */
async function commitFile(path, content, sha, message){
  const body = { message, content: b64(content), branch: BRANCH };
  if (sha) body.sha = sha;
  const put = () => fetch(`${API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
    method:"PUT",
    headers:{ Authorization:"Bearer " + token, Accept:"application/vnd.github+json", "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  let r = await put();
  if (r.status === 409 || r.status === 422) {
    body.sha = await fetchFileSha(path);
    r = await put();
  }
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    throw new Error(j.message || ("HTTP " + r.status));
  }
  const j = await r.json();
  return j.content && j.content.sha;
}

async function save(){
  if (!token) return;
  const btn = $("#save"); if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  const message = "progress: " + allDone() + "/" + allTasks();
  try {
    SHA = await commitFile("progress.json",
      JSON.stringify({ done:ST.done, projects:ST.projects, updated:new Date().toISOString() }, null, 2) + "\n",
      SHA, message);
    SVG_SHA = await commitFile("progress-bar.svg", buildBarSvg(), SVG_SHA, message);
    dirty = false; render();
    toast("Committed");
  } catch (e) {
    toast("Save failed: " + e.message, 4000);
    if (btn) { btn.disabled = false; btn.textContent = "Save"; }
  }
}

/* ---------- auth ---------- */
async function signIn(value){
  dialogErr = "";
  const t = value.trim();
  if (!t) { dialogErr = "Paste a token first."; render(); return; }
  try {
    const r = await fetch(`${API}/repos/${REPO_OWNER}/${REPO_NAME}`,
      { headers:{ Authorization:"Bearer " + t, Accept:"application/vnd.github+json" } });
    if (!r.ok) { dialogErr = r.status === 401 ? "Token rejected." : "Cannot reach the repo (HTTP " + r.status + ")."; render(); return; }
    token = t; localStorage.setItem(TOKEN_KEY, t);
    dialog = false; render(); fetchSha(); toast("Signed in");
  } catch (e) { dialogErr = "Network error."; render(); }
}
function signOut(){ token = null; SHA = null; SVG_SHA = null; dirty = false; localStorage.removeItem(TOKEN_KEY); render(); }

/* ---------- render ---------- */
function artifact(d){
  const p = ST.projects[d.id] || {};
  if (token) {
    return '<div class="art">' +
      '<input data-p="' + d.id + '" data-f="repo" placeholder="repository url" value="' + esc(p.repo) + '">' +
      '<input data-p="' + d.id + '" data-f="live" placeholder="live url (optional)" value="' + esc(p.live) + '">' +
      '<input data-p="' + d.id + '" data-f="note" placeholder="one line on what you built" value="' + esc(p.note) + '">' +
      "</div>";
  }
  const repo = safeUrl(p.repo), live = safeUrl(p.live);
  if (!repo && !live && !p.note) return '<div class="art empty">No project linked yet.</div>';
  return '<div class="art">' +
    (repo ? '<a href="' + esc(repo) + '" rel="noopener">repository</a>' : "") +
    (live ? '<a href="' + esc(live) + '" rel="noopener">live</a>' : "") +
    (p.note ? '<div class="note">' + esc(p.note) + "</div>" : "") + "</div>";
}

function render(){
  const d = allDone(), n = allTasks(), pct = n ? Math.round(d / n * 100) : 0, c = current();

  $("#app").innerHTML =
  '<header class="bar"><div class="bar-in">' +
    '<span class="brand">backend track</span><span class="spacer"></span>' +
    '<span class="mode">' + (token ? (dirty ? '<span class="dirty">unsaved</span>' : "owner") : "public view") + "</span>" +
    (token ? '<button class="btn primary" id="save"' + (dirty ? "" : " disabled") + ">Save</button>" +
             '<button class="btn" id="out">Sign out</button>'
           : '<button class="btn" id="in">Sign in</button>') +
  "</div></header>" +

  '<main class="wrap">' +
    "<h1>" + esc(CUR.title) + "</h1>" +
    '<p class="sub">' + esc(CUR.subtitle) + "</p>" +

    '<section class="gauge"><div class="gauge-top">' +
      '<div class="gauge-l">Readiness for the target service, across every skill it uses.</div>' +
      '<div class="gauge-n">' + pct + "<span>%</span></div></div>" +
      '<div class="track"><div class="fill" id="fill"></div></div>' +
      '<div class="stats"><span>' + d + " of " + n + " tasks</span><span>tier " + c +
      " in progress</span><span>" + (CUR.tiers.length - 1 - c) + " tiers remaining</span></div></section>" +

    '<section class="target"><h2>' + esc(CUR.target.heading) + "</h2><p>" + esc(CUR.target.body) + "</p>" +
      '<div class="specs">' + CUR.target.specs.map(s => '<span class="spec">' + esc(s) + "</span>").join("") + "</div></section>" +

    CUR.tiers.map((T, i) => {
      const td = tierDone(T), tt = tierTasks(T), full = td === tt, now = i === c, open = openTiers.has(i);
      return '<section class="tier' + (open ? " open" : "") + '" data-t="' + i + '">' +
        '<button class="thead" data-x="' + i + '" aria-expanded="' + open + '">' +
          '<span class="tnum">' + i + "</span>" +
          '<span class="tmain"><span class="tname">' + esc(T.name) + '</span><span class="tgoal">' + esc(T.goal) + "</span></span>" +
          '<span class="pill ' + (full ? "done" : now ? "now" : "") + '">' + td + "/" + tt + "</span>" +
        "</button><div class='tbody'>" +
        T.modules.map(M =>
          '<div class="mod"><div class="mname">' + esc(M.name) + "</div>" +
          M.tasks.map(k => {
            const val = ST.done[k.id], on = !!val;
            const dateStr = fmtDate(val);
            const editing = editingDate === k.id;
            return '<div class="task' + (on ? " on" : "") + '">' +
              (token ? '<input type="checkbox" id="' + k.id + '" data-k="' + k.id + '"' + (on ? " checked" : "") + ">"
                     : '<span class="mark' + (on ? " on" : "") + '"></span>') +
              (token ? '<label class="tlabel" for="' + k.id + '">' : '<span class="tlabel">') +
              esc(k.text) + (token ? "</label>" : "</span>") +
              (on ? (editing
                ? '<span class="tickdate"><input type="date" class="dateedit" data-de="' + k.id + '" value="' + esc(typeof val === "string" ? val : todayISO()) + '"></span>'
                : '<span class="tickdate">' + (dateStr || "date unknown") +
                  (token ? ' <button type="button" class="editdate" data-ed="' + k.id + '" title="Edit date" aria-label="Edit date">✎</button>' : "") +
                  "</span>")
                : "") +
              "</div>";
          }).join("") +
          (M.deliverable
            ? '<div class="dl"><strong>Deliverable</strong><span class="flag">' + esc(M.deliverable.label) + "</span></div>" + artifact(M.deliverable)
            : "") +
          "</div>").join("") +
        '<div class="proof"><strong>Done when</strong>' + esc(T.proof) + "</div></div></section>";
    }).join("") +

    '<div class="foot"><span>source on GitHub</span><span>' + d + "/" + n + "</span></div>" +
  "</main>" +

  (dialog ? '<div class="dialog" id="dlg"><div class="card">' +
      "<h3>Sign in</h3>" +
      "<p>Paste a GitHub personal access token with Contents write access to this repository. It is stored in this browser only.</p>" +
      (dialogErr ? '<p class="err">' + esc(dialogErr) + "</p>" : "") +
      '<input type="password" id="tok" placeholder="github_pat_…" autocomplete="off">' +
      '<div class="row"><button class="btn" id="cancel">Cancel</button>' +
      '<button class="btn primary" id="go">Sign in</button></div>' +
    "</div></div>" : "");

  requestAnimationFrame(() => { const f = $("#fill"); if (f) f.style.width = pct + "%"; });
  wire();
}

function wire(){
  const app = $("#app");

  const inBtn = $("#in");   if (inBtn) inBtn.onclick = () => { dialog = true; dialogErr = ""; render(); $("#tok") && $("#tok").focus(); };
  const outBtn = $("#out"); if (outBtn) outBtn.onclick = () => { if (!dirty || confirm("Unsaved changes will be lost. Sign out?")) signOut(); };
  const saveBtn = $("#save"); if (saveBtn) saveBtn.onclick = save;

  const go = $("#go");
  if (go) {
    go.onclick = () => signIn($("#tok").value);
    $("#cancel").onclick = () => { dialog = false; dialogErr = ""; render(); };
    $("#tok").onkeydown = e => { if (e.key === "Enter") signIn($("#tok").value); };
    $("#dlg").onclick = e => { if (e.target.id === "dlg") { dialog = false; render(); } };
  }

  app.querySelectorAll("[data-x]").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.x);
    openTiers.has(i) ? openTiers.delete(i) : openTiers.add(i);
    render();
  });

  app.querySelectorAll("input[data-k]").forEach(cb => cb.onchange = () => {
    if (cb.checked) ST.done[cb.dataset.k] = todayISO(); else delete ST.done[cb.dataset.k];
    editingDate = null; dirty = true; render();
  });

  app.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => {
    editingDate = b.dataset.ed; render();
    const inp = $('input[data-de="' + editingDate + '"]'); if (inp) inp.focus();
  });

  app.querySelectorAll("input[data-de]").forEach(inp => {
    const commit = () => {
      if (inp.value) ST.done[inp.dataset.de] = inp.value;
      editingDate = null; dirty = true; render();
    };
    inp.onchange = commit;
    inp.onblur = commit;
    inp.onkeydown = e => { if (e.key === "Escape") { editingDate = null; render(); } };
  });

  app.querySelectorAll("input[data-p]").forEach(inp => inp.oninput = () => {
    const id = inp.dataset.p;
    ST.projects[id] = ST.projects[id] || {};
    ST.projects[id][inp.dataset.f] = inp.value;
    if (!dirty) { dirty = true; const m = $(".mode"); if (m) m.innerHTML = '<span class="dirty">unsaved</span>';
      const s = $("#save"); if (s) s.disabled = false; }
  });
}

window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
boot();
</script>
</body>
</html>
